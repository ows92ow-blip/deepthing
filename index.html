<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Auth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); height: 100vh; display: flex; justify-content: center; align-items: center; color: #fff; }
        .login-box { 
            background: rgba(255, 255, 255, 0.05); padding: 40px; border-radius: 15px; 
            box-shadow: 0 15px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; width: min(300px, 90vw); backdrop-filter: blur(10px);
            transition: transform 0.1s;
        }
        h2 { margin-bottom: 30px; letter-spacing: 2px; color: #00d2ff; text-shadow: 0 0 10px rgba(0,210,255,0.5); }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        .input-group input { 
            width: 100%; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid #444; 
            border-radius: 5px; color: #fff; outline: none; transition: 0.3s; 
        }
        .input-group input:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.3); }
        button { 
            width: 100%; padding: 12px; background: #00d2ff; color: #000; border: none; 
            border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; 
        }
        button:hover:not(:disabled) { background: #fff; box-shadow: 0 0 15px #00d2ff; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #error-msg { color: #ff4b2b; font-size: 14px; margin-top: 15px; display: none; min-height: 20px; }
        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>

<div class="login-box" id="login-box">
    <h2>SECURE LOGIN</h2>
    <div class="input-group">
        <label for="username">Account</label>
        <input type="text" id="username" placeholder="Enter account" required autocomplete="username">
    </div>
    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
    </div>
    <button id="login-btn">AUTHENTICATE</button>
    <div id="error-msg" aria-live="polite"></div>
</div>

<script>
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('error-msg');
    const box = document.getElementById('login-box');

    async function login() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;

        errorEl.style.display = 'none';

        if (!user || !pass) {
            showError('请输入账号和密码');
            return;
        }

        btn.disabled = true;
        btn.innerText = 'CHECKING...';

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify({ username: user, password: pass })
            });
            
            if (!res.ok) {
                if (res.status === 401) showError('账号或密码错误');
                else showError('服务器故障，请稍后再试');
                return;
            }

            const data = await res.json();
            if (data.success) {
                sessionStorage.setItem('auth_state', 'valid');
                window.location.href = '/test.html';
            } else {
                showError('验证失败');
            }
        } catch (err) {
            showError('网络错误，请检查连接');
            console.error('Login error:', err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'AUTHENTICATE';
        }
    }

    function showError(msg) {
        errorEl.innerText = msg;
        errorEl.style.display = 'block';
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
    }

    btn.addEventListener('click', login);
    document.getElementById('password').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });
</script>

</body>
</html>
