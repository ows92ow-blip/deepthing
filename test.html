<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>System Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between; 
            padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)) 20px;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .hp-bar { width: 40%; height: 20px; background: rgba(0,0,0,0.5); border: 2px solid #fff; border-radius: 10px; overflow: hidden; position: relative; }
        .hp-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #p1-hp { background: #00d2ff; }
        #p2-hp { background: #ff4b2b; float: right; }
        #turn-indicator { font-size: 24px; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px #000; }
        .bottom-bar { display: flex; justify-content: space-between; align-items: flex-end; }
        .stats { background: rgba(0,0,0,0.6); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 18px; font-weight: bold; border: 1px solid #444; }
        #end-screen {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 40px; border-radius: 20px; text-align: center; pointer-events: auto; display: none; border: 2px solid #fff;
        }
        #end-screen h1 { color: #fff; margin-bottom: 20px; font-size: 36px; }
        #restart-btn { padding: 15px 30px; font-size: 20px; background: #00d2ff; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #restart-btn:hover { background: #fff; }
        .map-text { position: absolute; top: calc(70px + env(safe-area-inset-top)); width: 100%; text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

<canvas id="mainCanvas"></canvas>
<div id="ui-layer">
    <div class="top-bar">
        <div class="hp-bar"><div id="p1-hp" class="hp-fill"></div></div>
        <div id="turn-indicator">YOUR TURN</div>
        <div class="hp-bar"><div id="p2-hp" class="hp-fill"></div></div>
    </div>
    <div class="map-text" id="map-display">ENV 1: FLATLANDS</div>
    <div class="bottom-bar">
        <div class="stats" id="stats-display">ANGLE: 45°<br>POWER: 50</div>
    </div>
</div>
<div id="end-screen">
    <h1 id="result-text">COMPLETED</h1>
    <button id="restart-btn">NEXT ENV</button>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    
    const p1HpEl = document.getElementById('p1-hp');
    const p2HpEl = document.getElementById('p2-hp');
    const turnEl = document.getElementById('turn-indicator');
    const statsEl = document.getElementById('stats-display');
    const endScreenEl = document.getElementById('end-screen');
    const resultTextEl = document.getElementById('result-text');
    const restartBtn = document.getElementById('restart-btn');
    const mapDisplayEl = document.getElementById('map-display');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    bgCanvas.width = width;
    bgCanvas.height = height * 2;

    const terrainCanvas = document.createElement('canvas');
    const terrainCtx = terrainCanvas.getContext('2d', { willReadFrequently: true });
    terrainCanvas.width = width;
    terrainCanvas.height = height;

    let currentMapIndex = 0;
    const mapNames = ["ENV 1: FLATLANDS", "ENV 2: MOUNTAIN", "ENV 3: VALLEY"];
    let isPlayerTurn = true;
    let isFiring = false;
    let isFinished = false;
    let botTimer = 0;

    const GRAVITY = 0.15;
    let projectile = null;
    let particles = [];
    
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let currentDragPos = { x: 0, y: 0 };
    let currentAngle = 45;
    let currentPower = 50;
    const MAX_POWER = 100;
    const POWER_MULTIPLIER = 0.25;

    let shakeTime = 0;
    let shakeIntensity = 0;
    let cameraY = 0;
    let targetCameraY = 0;

    const p1 = { x: 0, y: 0, vy: 0, hp: 100, color: '#00d2ff', angle: 45, hurtTimer: 0 };
    const p2 = { x: 0, y: 0, vy: 0, hp: 100, color: '#ff4b2b', angle: 135, hurtTimer: 0 };

    function initApp(mapIndex) {
        currentMapIndex = mapIndex % 3;
        mapDisplayEl.innerText = mapNames[currentMapIndex];
        
        p1.hp = 100; p2.hp = 100;
        p1.angle = 45; p2.angle = 135;
        p1.vy = 0; p2.vy = 0;
        p1.hurtTimer = 0; p2.hurtTimer = 0;
        currentAngle = 45; currentPower = 50;
        isPlayerTurn = true;
        isFiring = false;
        isFinished = false;
        projectile = null;
        particles = [];
        shakeTime = 0;
        cameraY = 0;
        targetCameraY = 0;
        endScreenEl.style.display = 'none';
        turnEl.innerText = "YOUR TURN";
        updateUI();

        generateBackground();
        generateTerrain();
        spawnUnits();
    }

    function generateBackground() {
        bgCtx.clearRect(0, 0, width, height * 2);

        let skyGrad = bgCtx.createLinearGradient(0, 0, 0, height * 2);
        skyGrad.addColorStop(0, '#0f172a');
        skyGrad.addColorStop(0.4, '#1e1b4b');
        skyGrad.addColorStop(1, '#312e81');
        bgCtx.fillStyle = skyGrad;
        bgCtx.fillRect(0, 0, width, height * 2);

        bgCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        for (let i = 0; i < 120; i++) {
            let sx = Math.random() * width;
            let sy = Math.random() * (height * 1.5);
            let size = Math.random() * 2;
            bgCtx.beginPath();
            bgCtx.arc(sx, sy, size, 0, Math.PI * 2);
            bgCtx.fill();
        }

        bgCtx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        for (let i = 0; i < 15; i++) {
            let cx = Math.random() * width;
            let cy = height * 0.2 + Math.random() * height * 0.8;
            let cw = 100 + Math.random() * 150;
            let ch = 20 + Math.random() * 30;
            bgCtx.beginPath();
            bgCtx.roundRect(cx, cy, cw, ch, 20);
            bgCtx.fill();
        }

        let baseY = height * 0.7;
        bgCtx.fillStyle = '#151a30';
        for (let x = -50; x < width; x += 40) {
            let bw = 30 + Math.random() * 40;
            let bh = 50 + Math.random() * 150;
            bgCtx.fillRect(x, baseY - bh, bw, bh);
            
            bgCtx.fillStyle = 'rgba(255, 215, 0, 0.2)';
            for(let wy = baseY - bh + 10; wy < baseY - 10; wy += 15) {
                for(let wx = x + 5; wx < x + bw - 5; wx += 10) {
                    if(Math.random() > 0.5) {
                        bgCtx.fillRect(wx, wy, 3, 5);
                    }
                }
            }
            bgCtx.fillStyle = '#151a30';
        }

        bgCtx.strokeStyle = '#151a30';
        bgCtx.lineWidth = 3;
        bgCtx.beginPath();
        bgCtx.moveTo(width * 0.7, baseY);
        bgCtx.lineTo(width * 0.7, baseY - 120);
        bgCtx.moveTo(width * 0.7 - 20, baseY - 100);
        bgCtx.lineTo(width * 0.7 + 20, baseY - 100);
        bgCtx.stroke();
    }

    function generateTerrain() {
        terrainCtx.clearRect(0, 0, width, height);

        let points = [];
        for (let x = 0; x <= width; x += 5) {
            let y = height * 0.7;
            let t = x / width;

            if (currentMapIndex === 0) {
                y += Math.sin(t * Math.PI * 4) * 30 + Math.cos(t * Math.PI * 8) * 15;
            } else if (currentMapIndex === 1) {
                y -= Math.sin(t * Math.PI) * height * 0.3;
            } else if (currentMapIndex === 2) {
                y += Math.sin(t * Math.PI) * height * 0.25;
            }
            points.push({x, y});
        }

        terrainCtx.beginPath();
        terrainCtx.moveTo(0, height);
        points.forEach(p => terrainCtx.lineTo(p.x, p.y));
        terrainCtx.lineTo(width, height);
        terrainCtx.closePath();
        terrainCtx.fillStyle = '#5c2e16';
        terrainCtx.fill();

        terrainCtx.save();
        terrainCtx.clip();

        terrainCtx.beginPath();
        terrainCtx.moveTo(0, height);
        points.forEach(p => terrainCtx.lineTo(p.x, p.y + 30));
        terrainCtx.lineTo(width, height);
        terrainCtx.closePath();
        terrainCtx.fillStyle = '#8B4513';
        terrainCtx.fill();

        terrainCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        for(let i=0; i<300; i++) {
            let tx = Math.random() * width;
            let ty = height * 0.6 + Math.random() * (height * 0.4);
            terrainCtx.beginPath();
            terrainCtx.arc(tx, ty, 1 + Math.random() * 4, 0, Math.PI * 2);
            terrainCtx.fill();
        }

        terrainCtx.restore();

        terrainCtx.beginPath();
        terrainCtx.moveTo(points[0].x, points[0].y);
        points.forEach(p => terrainCtx.lineTo(p.x, p.y));
        terrainCtx.strokeStyle = '#d98a59';
        terrainCtx.lineWidth = 3;
        terrainCtx.stroke();
    }

    function getTerrainY(x) {
        if (x < 0 || x >= width) return height;
        const data = terrainCtx.getImageData(Math.floor(x), 0, 1, height).data;
        for (let y = 0; y < height; y++) {
            if (data[y * 4 + 3] > 0) return y;
        }
        return height;
    }

    function spawnUnits() {
        p1.x = width * 0.15;
        p1.y = getTerrainY(p1.x);
        p2.x = width * 0.85;
        p2.y = getTerrainY(p2.x);
    }

    function applyTankGravity(tank) {
        let groundY = getTerrainY(tank.x);
        if (tank.y < groundY - 1) {
            tank.vy += 0.35;
            tank.y += tank.vy;
            if (tank.y >= groundY) {
                let impact = tank.vy;
                tank.y = groundY;
                tank.vy = 0;
                if (impact > 6 && !isFinished) {
                    let dmg = Math.floor(impact * 2.5);
                    tank.hp = Math.max(0, tank.hp - dmg);
                    tank.hurtTimer = 10;
                    shakeTime = 10;
                    shakeIntensity = 5;
                    updateUI();
                    
                    if (tank.hp <= 0) {
                        isFinished = true;
                        resultTextEl.innerText = tank === p1 ? "FAILED" : "COMPLETED";
                        endScreenEl.style.display = 'block';
                    }
                }
            }
        } else {
            tank.y = groundY;
            tank.vy = 0;
        }
    }

    function drawUnit(unit, isPlayer) {
        let leftY = getTerrainY(unit.x - 20);
        let rightY = getTerrainY(unit.x + 20);
        let tilt = Math.atan2(rightY - leftY, 40);
        
        if (unit.y < leftY - 5 || unit.y < rightY - 5) tilt = 0;

        ctx.save();
        ctx.translate(unit.x, unit.y);
        ctx.rotate(tilt);
        
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.roundRect(-26, -14, 52, 14, 6);
        ctx.fill();
        
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for(let i=-20; i<=20; i+=8) {
            ctx.moveTo(i, -14);
            ctx.lineTo(i, 0);
        }
        ctx.stroke();

        ctx.fillStyle = '#333';
        [-16, 0, 16].forEach(wx => {
            ctx.beginPath();
            ctx.arc(wx, -7, 5, 0, Math.PI*2);
            ctx.fill();
        });

        ctx.fillStyle = unit.hurtTimer > 0 ? '#ffffff' : unit.color;
        ctx.beginPath();
        ctx.moveTo(-22, -14);
        ctx.lineTo(22, -14);
        ctx.lineTo(16, -26);
        ctx.lineTo(-16, -26);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, -26, 10, Math.PI, Math.PI * 2);
        ctx.fill();
        
        if (unit.hurtTimer <= 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(-2, -28, 5, Math.PI, Math.PI * 2);
            ctx.fill();
        }

        ctx.save();
        ctx.translate(0, -26);
        let angleRad = -unit.angle * Math.PI / 180;
        ctx.rotate(angleRad - tilt);
        
        ctx.fillStyle = unit.hurtTimer > 0 ? '#ffffff' : '#555';
        ctx.beginPath();
        ctx.roundRect(0, -4, 38, 8, 2);
        ctx.fill();
        
        ctx.fillStyle = unit.hurtTimer > 0 ? '#ffffff' : '#222';
        ctx.beginPath();
        ctx.roundRect(32, -6, 8, 12, 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();

        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath();
        ctx.roundRect(unit.x - 30, unit.y - 60, 60, 8, 4);
        ctx.fill();
        ctx.fillStyle = unit.color;
        ctx.beginPath();
        ctx.roundRect(unit.x - 28, unit.y - 58, 56 * (unit.hp / 100), 4, 2);
        ctx.fill();
    }

    function explode(x, y, radius) {
        terrainCtx.globalCompositeOperation = 'destination-out';
        terrainCtx.beginPath();
        terrainCtx.arc(x, y, radius, 0, Math.PI * 2);
        terrainCtx.fill();
        terrainCtx.globalCompositeOperation = 'source-over';

        for (let i = 0; i < 30; i++) {
            particles.push({
                type: 'fire',
                x: x, y: y,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                life: 1, color: Math.random() > 0.5 ? '#ff4b2b' : '#ffd700'
            });
        }
        
        particles.push({
            type: 'shockwave',
            x: x, y: y,
            radius: radius,
            life: 1
        });

        shakeTime = 15;
        shakeIntensity = 8;

        checkDamage(p1, x, y, radius);
        checkDamage(p2, x, y, radius);

        if (p1.hp <= 0 || p2.hp <= 0) {
            isFinished = true;
            resultTextEl.innerText = p1.hp <= 0 ? "FAILED" : "COMPLETED";
            endScreenEl.style.display = 'block';
        } else {
            isPlayerTurn = !isPlayerTurn;
            isFiring = false;
            if (!isPlayerTurn) {
                turnEl.innerText = "SYSTEM TURN";
                botTimer = 60;
            } else {
                turnEl.innerText = "YOUR TURN";
            }
        }
    }

    function checkDamage(unit, ex, ey, radius) {
        const dx = unit.x - ex;
        const dy = unit.y - 10 - ey;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < radius + 25) {
            const damage = Math.max(0, Math.floor(50 * (1 - dist / (radius + 25))));
            unit.hp = Math.max(0, unit.hp - damage);
            unit.hurtTimer = 10;
            updateUI();
        }
    }

    function fire(unit, power) {
        const rad = -unit.angle * Math.PI / 180;
        const vx = Math.cos(rad) * power * POWER_MULTIPLIER;
        const vy = Math.sin(rad) * power * POWER_MULTIPLIER;
        
        let muzzleX = unit.x + Math.cos(rad) * 38;
        let muzzleY = unit.y - 26 + Math.sin(rad) * 38;

        for (let i = 0; i < 12; i++) {
            particles.push({
                type: 'fire',
                x: muzzleX, y: muzzleY,
                vx: Math.cos(rad + (Math.random()-0.5)*0.5) * (5 + Math.random()*5),
                vy: Math.sin(rad + (Math.random()-0.5)*0.5) * (5 + Math.random()*5),
                life: 0.5, color: Math.random() > 0.5 ? '#fff' : '#ffd700'
            });
        }

        projectile = {
            x: muzzleX,
            y: muzzleY,
            vx: vx, vy: vy,
            owner: unit
        };
    }

    function systemThink() {
        let basePower = 30 + Math.random() * 70;
        let errorAngle = 100 + Math.random() * 70;
        
        p2.angle = errorAngle;
        fire(p2, basePower);
        isFiring = true;
    }

    function updateUI() {
        p1HpEl.style.width = p1.hp + '%';
        p2HpEl.style.width = p2.hp + '%';
        statsEl.innerHTML = `ANGLE: ${Math.round(p1.angle)}°<br>POWER: ${Math.round(currentPower)}`;
    }

    function mainLoop() {
        if (projectile && projectile.owner === p1) {
            if (projectile.y < height * 0.5) {
                targetCameraY = Math.max(0, height * 0.5 - projectile.y);
            } else {
                targetCameraY = 0;
            }
        } else {
            targetCameraY = 0;
        }

        cameraY += (targetCameraY - cameraY) * 0.08;

        ctx.save();
        
        let dx = 0, dy = 0;
        if (shakeTime > 0) {
            dx = (Math.random() - 0.5) * shakeIntensity;
            dy = (Math.random() - 0.5) * shakeIntensity;
            shakeTime--;
        }
        
        ctx.translate(dx, dy + cameraY);

        ctx.drawImage(bgCanvas, 0, -height);
        ctx.drawImage(terrainCanvas, 0, 0);

        if (p1.hurtTimer > 0) p1.hurtTimer--;
        if (p2.hurtTimer > 0) p2.hurtTimer--;

        if (!isFinished) {
            applyTankGravity(p1);
            applyTankGravity(p2);
        }

        if (isPlayerTurn && isDragging && !isFiring && !isFinished) {
            let tdx = currentDragPos.x - dragStart.x;
            let tdy = currentDragPos.y - dragStart.y;
            let distance = Math.hypot(tdx, tdy);
            
            if (distance > 5) {
                let pullAngle = Math.atan2(tdy, tdx);
                let actualLength = Math.min(100, distance); 
                
                let endX = p1.x + Math.cos(pullAngle) * actualLength;
                let endY = (p1.y - 26) + Math.sin(pullAngle) * actualLength;

                ctx.beginPath();
                ctx.setLineDash([8, 8]);
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.moveTo(p1.x, p1.y - 26);
                ctx.lineTo(endX, endY);
                ctx.stroke();
                ctx.setLineDash([]);
                
                ctx.beginPath();
                ctx.arc(endX, endY, 22, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 210, 255, 0.3)';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        if (isPlayerTurn && isDragging && !isFiring && !isFinished) {
            const rad = -currentAngle * Math.PI / 180;
            let px = p1.x + Math.cos(rad) * 38;
            let py = p1.y - 26 + Math.sin(rad) * 38;
            let vx = Math.cos(rad) * currentPower * POWER_MULTIPLIER;
            let vy = Math.sin(rad) * currentPower * POWER_MULTIPLIER;

            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            for (let i = 0; i < 40; i++) {
                px += vx; py += vy; vy += GRAVITY;
                ctx.lineTo(px, py);
                if (px < 0 || px > width || py > height) break;
                const pData = terrainCtx.getImageData(Math.floor(px), Math.floor(py), 1, 1).data;
                if (pData[3] > 0) break;
            }
            ctx.stroke();
            ctx.setLineDash([]);
        }

        if (!isFinished || p1.hp > 0) drawUnit(p1, true);
        if (!isFinished || p2.hp > 0) drawUnit(p2, false);

        if (projectile) {
            projectile.vy += GRAVITY;
            projectile.x += projectile.vx;
            projectile.y += projectile.vy;

            ctx.beginPath();
            ctx.arc(projectile.x, projectile.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffd700';
            ctx.fill();
            ctx.shadowBlur = 0;

            let hit = false;
            if (projectile.x < 0 || projectile.x > width || projectile.y > height) hit = true;
            else {
                const pData = terrainCtx.getImageData(Math.floor(projectile.x), Math.floor(projectile.y), 1, 1).data;
                if (pData[3] > 0) hit = true;
            }

            const hitTank = (t) => Math.abs(projectile.x - t.x) < 25 && Math.abs(projectile.y - (t.y - 15)) < 20;
            if (hitTank(p1) || hitTank(p2)) hit = true;

            if (hit) {
                explode(projectile.x, projectile.y, 45);
                projectile = null;
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            if (p.type === 'shockwave') {
                ctx.globalAlpha = p.life;
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius * (1.8 - p.life), 0, Math.PI * 2);
                ctx.stroke();
                p.life -= 0.08;
            } else {
                p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 6, 6);
            }
            
            if (p.life <= 0) { particles.splice(i, 1); }
        }
        ctx.globalAlpha = 1.0;

        if (!isPlayerTurn && !isFiring && !isFinished) {
            if (botTimer > 0) botTimer--;
            else systemThink();
        }

        ctx.restore();
        requestAnimationFrame(mainLoop);
    }

    function getPointerPos(e) {
        if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY - cameraY };
        return { x: e.clientX, y: e.clientY - cameraY };
    }

    function onDown(e) {
        if (!isPlayerTurn || isFiring || isFinished) return;
        const pos = getPointerPos(e);
        
        if (pos.y > height * 0.2) {
            isDragging = true;
            dragStart = { x: pos.x, y: pos.y };
            currentDragPos = { x: pos.x, y: pos.y };
            currentPower = 0;
            updateUI();
        }
    }

    function onMove(e) {
        if (!isDragging || !isPlayerTurn || isFiring || isFinished) return;
        e.preventDefault();
        const pos = getPointerPos(e);
        currentDragPos = { x: pos.x, y: pos.y };
        
        const dx = dragStart.x - pos.x;
        const dy = dragStart.y - pos.y;
        
        currentPower = Math.min(MAX_POWER, Math.hypot(dx, dy) * 0.4);
        
        if (currentPower > 2) {
            let angle = Math.atan2(-dy, dx) * 180 / Math.PI;
            if (angle < 0) angle = 0;
            if (angle > 180) angle = 180;
            
            if (dx < 0) currentAngle = 180 - angle;
            else currentAngle = angle;
            
            p1.angle = currentAngle;
        }
        
        updateUI();
    }

    function onUp(e) {
        if (!isDragging || !isPlayerTurn || isFiring || isFinished) return;
        isDragging = false;
        if (currentPower > 5) {
            fire(p1, currentPower);
            isFiring = true;
        } else {
            currentPower = 50;
            updateUI();
        }
    }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);

    restartBtn.addEventListener('click', () => initApp(currentMapIndex + 1));

    window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        bgCanvas.width = width;
        bgCanvas.height = height * 2;
        terrainCanvas.width = width;
        terrainCanvas.height = height;
        initApp(currentMapIndex);
    });

    initApp(0);
    mainLoop();
</script>
</body>
</html>
